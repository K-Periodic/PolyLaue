name: Tests

on:
  push:
    branches: [main]
    tags: ['[0-9]*', 'v[0-9]*']
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install black
        run: pip install black

      - name: Check formatting with black
        run: black --check .

      - name: Check copyright headers
        run: |
          python scripts/add_copyright_to_source_files.py
          git diff --exit-code

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every supported platform/version result even if one job fails.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        if: runner.os == 'Linux'
        # Qt needs these to import in the UI tests
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0

      - name: Install dependencies
        run: |
         pip install --upgrade pip
         pip install -e .
         pip install pytest

      - name: Run tests
        run: python -m pytest -v
        env:
          # Select the headless Qt backend before PySide6 is imported. Setting
          # this inside the QApplication fixture is too late on some runners.
          QT_QPA_PLATFORM: 'offscreen'
          PYTHONFAULTHANDLER: '1'
          SKIP_SLOW_TESTS: '1'

  package:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # setuptools_scm needs the tag history to calculate a real version.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Build and inspect distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
          python - <<'PY'
          import glob
          import tarfile
          import zipfile

          wheel = glob.glob('dist/*.whl')
          assert len(wheel) == 1, wheel
          with zipfile.ZipFile(wheel[0]) as archive:
              names = set(archive.namelist())
          assert 'polylaue/model/core/orientation_relationship.py' in names
          assert 'polylaue/ui/grain_orientation_dialog.py' in names
          assert 'polylaue/ui/resources/ui/main_window.ui' in names

          sdist = glob.glob('dist/*.tar.gz')
          assert len(sdist) == 1, sdist
          with tarfile.open(sdist[0]) as archive:
              names = set(archive.getnames())
          assert any(name.endswith('/environment.yml') for name in names)
          PY

      - name: Verify the installed wheel outside the checkout
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          python - <<'PY'
          import importlib.metadata
          import os
          import polylaue

          version = importlib.metadata.version('polylaue')
          print('module:', polylaue.__file__)
          print('version:', version)
          assert version != '0.0.0'
          if os.environ.get('GITHUB_REF_TYPE') == 'tag':
              expected = os.environ['GITHUB_REF_NAME'].removeprefix('v')
              assert version == expected, (version, expected)
          PY

      - name: Save verified release files
        uses: actions/upload-artifact@v7
        with:
          # Pull-request ref names contain a forbidden slash (for example,
          # "1/merge"). Run IDs and attempt numbers are always safe and also
          # keep artifacts from separate reruns distinct.
          name: polylaue-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            environment.yml
          if-no-files-found: error
          retention-days: 14
